[project]
name = "amazon-ml-2026-athena"
version = "0.1.0"
description = "Business Entity Resolution Pipeline for Amazon ML Challenge 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "rapidfuzz>=3.9.0",
    "scipy>=1.13.0",
    "psutil>=5.9.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
